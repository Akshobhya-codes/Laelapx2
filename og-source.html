<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG Source — Laelapx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family:'Inter', -apple-system, sans-serif;
    background:#f7f5f0;
    color:#191714;
    padding:80px;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  .accent {
    position:absolute; top:0; left:0;
    width:14px; height:100%;
    background:#2c5ba8;
  }
  .logo {
    font-size:38px; font-weight:900;
    color:#1c2b42; letter-spacing:-1px;
  }
  .logo span { color:#2c5ba8; }
  .eyebrow {
    margin-top:60px;
    font-size:17px; font-weight:700;
    color:#2c5ba8;
    letter-spacing:3.5px; text-transform:uppercase;
  }
  h1 {
    margin-top:20px;
    font-size:92px; font-weight:900;
    line-height:1.0; letter-spacing:-3px;
    color:#1c2b42;
    max-width:1000px;
  }
  .sub {
    margin-top:24px;
    font-size:24px; font-weight:400;
    color:#5a5650;
    max-width:920px; line-height:1.35;
  }
  .footer-row {
    position:absolute;
    bottom:64px; left:80px; right:80px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:18px; font-weight:600; color:#5a5650;
  }
  .url { color:#1c2b42; font-weight:800; }
  .pill {
    padding:8px 18px;
    border:1.5px solid rgba(44,91,168,0.3);
    border-radius:999px;
    font-size:14px;
    color:#2c5ba8; font-weight:700;
    letter-spacing:1.5px; text-transform:uppercase;
  }
</style>
</head>
<body>
  <div class="accent"></div>
  <div class="logo">Laelapx<span>.</span></div>
  <div class="eyebrow">Fundability Intelligence</div>
  <h1>Know why<br>before you pitch.</h1>
  <p class="sub">Pre-analyzed deal flow for investors. Fundability snapshots for founders.</p>
  <div class="footer-row">
    <span class="url">laelapx.com</span>
    <span class="pill">Pre-Launch</span>
  </div>
</body>
</html>
