<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not Found — Laelapx</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f5f0;
  --navy: #1c2b42;
  --blue: #2c5ba8;
  --blue-lt: #4a78cc;
  --text-1: #191714;
  --text-2: #5a5650;
  --text-3: #9a968e;
  --border: rgba(25,23,20,0.1);
  --pad: clamp(20px, 5vw, 80px);
}
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text-1);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a { color: inherit; text-decoration: none; }

nav.nf-nav {
  padding: 22px var(--pad);
  border-bottom: 1px solid var(--border);
}
nav.nf-nav a {
  font-weight: 900;
  color: var(--navy);
  font-size: 17px;
  letter-spacing: -0.5px;
}
nav.nf-nav a span { color: var(--blue); }

main.nf-main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 80px var(--pad);
  text-align: center;
}
.nf-inner { max-width: 540px; }

.nf-code {
  font-size: clamp(96px, 16vw, 168px);
  font-weight: 900;
  color: var(--blue);
  letter-spacing: -6px;
  line-height: 1;
  margin-bottom: 8px;
}
.nf-eyebrow {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 2.5px;
  text-transform: uppercase;
  margin-bottom: 16px;
}
.nf-h1 {
  font-size: clamp(28px, 4vw, 40px);
  font-weight: 900;
  color: var(--navy);
  letter-spacing: -1px;
  line-height: 1.15;
  margin-bottom: 14px;
}
.nf-sub {
  color: var(--text-2);
  font-size: 16px;
  line-height: 1.55;
  margin-bottom: 32px;
}
.nf-actions {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn-primary, .btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 13px 24px;
  border-radius: 4px;
  font-weight: 600;
  font-size: 14px;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.btn-primary {
  background: var(--blue);
  color: #fff;
}
.btn-primary:hover { background: var(--navy); }
.btn-ghost {
  border: 1px solid var(--border);
  color: var(--text-1);
}
.btn-ghost:hover { border-color: var(--navy); color: var(--navy); }

.nf-links {
  margin-top: 48px;
  padding-top: 32px;
  border-top: 1px solid var(--border);
  font-size: 13px;
  color: var(--text-3);
}
.nf-links a {
  color: var(--text-2);
  margin: 0 10px;
  font-weight: 500;
}
.nf-links a:hover { color: var(--navy); }

footer.nf-footer {
  background: var(--navy);
  padding: 24px var(--pad);
  text-align: center;
  color: rgba(255,255,255,0.4);
  font-size: 12px;
}
</style>
</head>
<body>

<nav class="nf-nav">
  <a href="/">Laelapx<span>.</span></a>
</nav>

<main class="nf-main">
  <div class="nf-inner">
    <div class="nf-code">404</div>
    <span class="nf-eyebrow">Page Not Found</span>
    <h1 class="nf-h1">No signal here.</h1>
    <p class="nf-sub">The page you're looking for doesn't exist — or it moved before we could send you the Snapshot. Try one of the routes below.</p>
    <div class="nf-actions">
      <a href="/" class="btn-primary">Back to Laelapx →</a>
      <a href="/snapshot" class="btn-ghost">See a sample Snapshot</a>
    </div>
    <div class="nf-links">
      <a href="/founders">For Founders</a> ·
      <a href="/investors">For Investors</a> ·
      <a href="/snapshot">Sample</a> ·
      <a href="/privacy">Privacy</a> ·
      <a href="/terms">Terms</a>
    </div>
  </div>
</main>

<footer class="nf-footer">© 2026 Laelapx. Pre-launch.</footer>

<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
